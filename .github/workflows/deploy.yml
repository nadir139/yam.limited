# OUTGOING. yam.limited is moving to Vercel; see README → Deployment.
#
# This workflow is kept running only so the domain keeps being served while DNS
# still points at GitHub Pages. Delete it — together with CNAME, public/404.html
# and the ?redirect= script in index.html — as soon as `curl -sI
# https://yam.limited` returns an x-vercel-id header.
#
# Its two guards no longer live only here: they moved into scripts/preflight.mjs
# and scripts/verify-build.mjs so they survive this file being removed.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Guards the failure mode that broke runs #18-#21: duplicate exports that
      # only surface at build time. Note the explicit project — the root
      # tsconfig.json is `files: []` + references, so a bare `tsc --noEmit`
      # checks nothing and always passes.
      - name: Type check
        run: npm run typecheck

      - name: Build
        # Vite inlines VITE_* at build time. Without these the app still renders
        # its public pages, but /app has no backend. Set them as repository
        # secrets (Settings → Secrets and variables → Actions).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Warn if Supabase secrets are absent
        # The `secrets` context is not available to step-level `if`, so the check
        # happens in the shell against a masked env value.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set. Public pages will deploy fine, but /app routes will not load data."
          fi

      # The built index.html must reference a hashed bundle. If it still points
      # at /src/main.tsx it is the source file, which the browser refuses with
      # "Expected a JavaScript-or-Wasm module script but the server responded
      # with a MIME type of application/octet-stream" — a white screen.
      - name: Check the build produced a real bundle
        run: |
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html references the dev entry point. The build did not transform it."
            exit 1
          fi
          grep -q 'assets/index-' dist/index.html \
            || { echo "::error::dist/index.html has no hashed bundle."; exit 1; }

      - name: Copy CNAME to dist
        run: cp CNAME dist/CNAME

      - name: Copy .nojekyll to dist
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Deploying successfully is not the same as being served. On 1 Aug the
      # site white-screened while every deploy still reported success: the
      # artifact was correct and something else was answering for the domain.
      # This closes that gap — the run fails if the live page is not the page
      # we just published.
      - name: Verify the live site serves this build
        run: |
          sleep 20
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSL --max-time 30 https://yam.limited/ || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "yam.limited is serving the built bundle."
              exit 0
            fi
            echo "Attempt $attempt: not serving the built bundle yet; waiting."
            sleep 15
          done
          echo "::error::yam.limited is not serving this build. If the page references /src/main.tsx, GitHub Pages is serving the repository root instead of the uploaded artifact — check Settings → Pages → Build and deployment → Source is 'GitHub Actions'."
          printf '%s' "$body" | head -c 600
          exit 1
