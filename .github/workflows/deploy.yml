name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Guards the failure mode that broke runs #18-#21: duplicate exports that
      # only surface at build time. Note the explicit project — the root
      # tsconfig.json is `files: []` + references, so a bare `tsc --noEmit`
      # checks nothing and always passes.
      - name: Type check
        run: npm run typecheck

      - name: Build
        # Vite inlines VITE_* at build time. Without these the app still renders
        # its public pages, but /app has no backend. Set them as repository
        # secrets (Settings → Secrets and variables → Actions).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Warn if Supabase secrets are absent
        # The `secrets` context is not available to step-level `if`, so the check
        # happens in the shell against a masked env value.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are not set. Public pages will deploy fine, but /app routes will not load data."
          fi

      - name: Copy CNAME to dist
        run: cp CNAME dist/CNAME

      - name: Copy .nojekyll to dist
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
