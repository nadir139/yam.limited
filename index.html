    <!--
      Structured data, deliberately in the static document rather than injected
      by React.

      GPTBot, ClaudeBot and PerplexityBot do not execute JavaScript — they fetch
      the raw HTML and move on without a second attempt. Anything the app
      renders at runtime is invisible to them. What is written here is the only
      thing about YAM those crawlers can currently read, so it states the facts
      we can stand behind and nothing we cannot.
    -->
    <script type="application/ld+json">

        "logo": "https://yam.limited/logo.png",
        "image": "https://yam.limited/logo.png",
        "email": "info@yam.limited",
        "telephone": "+39 338 816 2035",
        "description": "Owner's representation and refit project management for sailing yachts and superyachts, led by a naval architect. YAM runs refits against a formal model of the work: every decision, cost impact and non-conformity is recorded against the object it concerns, and nothing can be closed without a reason.",
        "founder": {
          "@type": "Person",
          "@id": "https://yam.limited/#nadir-balena",
          "name": "Nadir Balena",
          "jobTitle": "Naval architect and yacht project manager",
          "email": "nadir.balena@gmail.com",
          "nationality": "Italian",
          "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "Southampton Solent University"
          },
          "hasCredential": [
            {
              "@type": "EducationalOccupationalCredential",

              "name": "BEng (Hons) Yacht and Powercraft Design — First Class Honours",
              "recognizedBy": { "@type": "CollegeOrUniversity", "name": "Southampton Solent University" }
            },
            { "@type": "EducationalOccupationalCredential", "credentialCategory": "certification", "name": "Yachtmaster Offshore (UKSA)" },
            { "@type": "EducationalOccupationalCredential", "credentialCategory": "certification", "name": "STCW 95" },
            { "@type": "EducationalOccupationalCredential", "credentialCategory": "certification", "name": "ENG 1" }
          ],
          "knowsLanguage": ["it", "en", "es"],
          "description": "Naval architect and project manager. Project engineer at Perini Navi coordinating the technical team on a 56-metre ketch new build; project manager for the Aragon 72 refit programme and for SY Sonny; sailing certification and optimisation on a 63-metre sailing yacht. Over 100,000 nautical miles, five Atlantic crossings and one Pacific. Tactics and navigation for first in class at the 2026 St Barth Bucket and Antigua Superyacht Challenge aboard the 68-metre schooner Adix."
        },

        },

        ],

          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Owner Representation", "description": "Advocacy and oversight through construction or refit, so the owner's interest is represented at the yard rather than assumed." } },

    </script>

    <script>
      // GitHub Pages has no SPA rewrite: it serves 404.html for any deep link,
      // which stashes the original path in ?redirect= and bounces here. Restore
      // it before the router boots, otherwise every deep link (including the
      // magic-link /auth/callback) silently lands on the homepage.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var target = params.get("redirect");
        if (!target) return;
        // Only ever restore same-origin absolute paths — never "//host" or a
        // full URL, which would turn this into an open redirect.
        if (target.charAt(0) !== "/" || target.charAt(1) === "/") return;
        history.replaceState(null, "", target);
      })();
    </script>
